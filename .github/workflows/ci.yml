name: CI

# Verification only. Deployment is handled by Cloudflare's Git integration
# (Workers Builds + Pages), so no Cloudflare credentials are stored in
# GitHub. See README → Deploy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
